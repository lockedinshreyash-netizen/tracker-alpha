<!DOCTYPE html>
<html lang="en-IN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- ══════════════════════════════════════════════════════════════════════
       Search and social
       ───────────────────────────────────────────────────────────────────────
       This block is what a crawler sees. The app is a single-page React bundle,
       so a crawler that does not execute JavaScript sees THIS and nothing else
       — the <div id="root"> below is empty until the bundle boots. Every claim
       about what Tracker Alpha is has to be here, in the HTML, or it is not
       being made at all.

       One name, everywhere. The title, the manifest and the structured data all
       say "Tracker Alpha"; before this they said three different things
       (LOCK IN JEE'27 Tracker / Tracker Alpha / LOCK IN), which splits the
       ranking signal across three brands and leaves the result looking
       unowned. "LOCK IN" survives as the in-app wordmark, which is the right
       place for it.

       Absolute URLs throughout. Crawlers and social unfurlers resolve og:image
       and canonical against their own origin, not the page's, so a relative
       path here is a missing image everywhere it matters.
       ══════════════════════════════════════════════════════════════════════ -->

  <!-- Title and description are rewritten at build time from landing/seo.ts
       (scripts/prerenderLanding.ts), so the copy below only has to be right in
       dev. Change them there. -->
  <title>Tracker Alpha: Free JEE &amp; NEET Study Tracker App for 2027</title>
  <meta name="description"
    content="Free study tracker for JEE and NEET 2027. Time every session, plan your day, track the syllabus chapter-wise, log mock tests and keep your streak. No ads." />
  <link rel="canonical" href="https://trackeralpha.in/" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <meta name="author" content="Tracker Alpha" />

  <!-- Two colours, because the app has two themes and the browser chrome should
       not fight the page it is wrapping. -->
  <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F2F0EC" media="(prefers-color-scheme: light)" />

  <!-- Icons. `favicon.ico` is the one Google's result row actually reads: it
       fetches /favicon.ico and the <link rel="icon"> set, and before this the
       page declared neither, which is why the search result has no logo. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph — WhatsApp, Telegram, LinkedIn, Discord, iMessage. WhatsApp is
       the one that matters for this audience, and it is also the strictest:
       it wants an absolute https image and gives up quietly without one. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tracker Alpha" />
  <meta property="og:title" content="Tracker Alpha — the free study tracker for JEE &amp; NEET 2027" />
  <meta property="og:description"
    content="Time every session. Plan your day. Finish the syllabus. It’s free, and it honestly shouldn’t be." />
  <meta property="og:url" content="https://trackeralpha.in/" />
  <meta property="og:image" content="https://trackeralpha.in/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Tracker Alpha — the free study tracker for JEE and NEET 2027" />
  <meta property="og:locale" content="en_IN" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tracker Alpha — the free study tracker for JEE &amp; NEET 2027" />
  <meta name="twitter:description"
    content="Time every session. Plan your day. Finish the syllabus. It’s free, and it honestly shouldn’t be." />
  <meta name="twitter:image" content="https://trackeralpha.in/og-image.png" />

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alpha">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Structured data is generated at build time from landing/content.ts and
       injected at the end of the head (scripts/prerenderLanding.ts): one JSON-LD
       graph of Organization, WebSite, WebApplication, WebPage and FAQPage,
       written from the same words the page shows, so it can never disagree. -->

  <!-- Hide the pre-rendered landing page before first paint for anyone who will
       not see it (returning, signed in, arriving on an invite). A hand copy of
       landing/gate.ts — change one, change both. Crawlers have no storage, so
       they always read the page. -->
  <script>
    (function () {
      var show = true;
      try {
        if (localStorage.getItem('hasVisited') === 'true') show = false;
        else if (new URLSearchParams(location.search).has('join')) show = false;
        else if (new URLSearchParams(location.search).has('open')) show = false;
        else if (localStorage.getItem('groups_pending_invite_v1')) show = false;
        else for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('sb-') === 0 && k.slice(-11) === '-auth-token') { show = false; break; }
        }
      } catch (e) { /* storage blocked: a new visitor */ }
      if (!show) document.documentElement.classList.add('lp-skip');
    })();
  </script>
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    body {
      font-family: 'Satoshi', system-ui, sans-serif;
      margin: 0;

<body>
  <div id="root"></div>
  <script>
    /* Absolute '/sw.js' with an explicit root scope, not './sw.js'.
       A relative path resolves against the PAGE, so a deep link would register
       a worker scoped to that subpath and pushes would never reach it. The
       worker itself is push-only and installs no fetch handler, so this does
       not change how anything loads. */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {
          /* No worker means no closed-app push. Everything else — the app, the
             in-app toasts, reminders while a tab is alive — is unaffected, so
             there is nothing to report and nothing to retry. */
        });
      });
    }
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
